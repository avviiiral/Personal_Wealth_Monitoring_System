name: PWMS Backend Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
      - "feature/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: Django checks and tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_ENGINE: sqlite
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration model consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run full backend test suite
        run: python manage.py test --verbosity 2

  postgres-tests:
    name: Django checks and tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pwms_ci
          POSTGRES_USER: pwms_ci
          POSTGRES_PASSWORD: pwms_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwms_ci -d pwms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: pwms_ci
      POSTGRES_USER: pwms_ci
      POSTGRES_PASSWORD: pwms_ci_only_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration model consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to clean PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run full backend test suite
        run: python manage.py test --verbosity 2

  frontend-checks:
    name: Angular build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test -- --watch=false
