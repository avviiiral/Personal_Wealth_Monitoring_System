name: Fix Asset Download Family Name

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updates-req
        uses: actions/checkout@v4
        with:
          ref: updates-req
          fetch-depth: 0

      - name: Add Family Name to Asset download
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/features/reports/reports.component.ts")
          text = path.read_text(encoding="utf-8")

          old_mapping = """      .map((tx) => ({
        underlying: this.getUnderlyingName(tx),
        transaction_date: new Date(tx.transaction_date),
        transaction_type: tx.transaction_type_display || tx.transaction_type,
        isin: tx.isin || '-',
        quantity: this.toNumber(tx.quantity),
        price_per_unit: this.toNumber(tx.price_per_unit),
        amount: this.toNumber(tx.amount),
      }));"""

          new_mapping = """      .map((tx) => ({
        family_name: this.clean(tx.family_name),
        underlying: this.getUnderlyingName(tx),
        transaction_date: new Date(tx.transaction_date),
        transaction_type: tx.transaction_type_display || tx.transaction_type,
        isin: tx.isin || '-',
        quantity: this.toNumber(tx.quantity),
        price_per_unit: this.toNumber(tx.price_per_unit),
        amount: this.toNumber(tx.amount),
      }));"""

          if old_mapping not in text:
              raise SystemExit("Asset download transaction mapping was not found")

          text = text.replace(old_mapping, new_mapping, 1)

          old_columns = """      columns: [
        { header: 'Underlying', key: 'underlying', width: 24 },
        { header: 'Transaction Date', key: 'transaction_date', width: 18, numFmt: 'dd-mmm-yyyy' },"""

          new_columns = """      columns: [
        { header: 'Family Name', key: 'family_name', width: 24 },
        { header: 'Underlying', key: 'underlying', width: 24 },
        { header: 'Transaction Date', key: 'transaction_date', width: 18, numFmt: 'dd-mmm-yyyy' },"""

          if old_columns not in text:
              raise SystemExit("Asset download Excel columns were not found")

          text = text.replace(old_columns, new_columns, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/reports/reports.component.ts
          git diff --cached --check
          git commit -m "fix: add family name to asset transaction download"
          git push origin updates-req
          git rm .github/workflows/fix-asset-download-family-name.yml
          git commit -m "chore: remove temporary asset download workflow"
          git push origin updates-req
