name: Fix Reports TS4111

on:
  push:
    branches:
      - updates-req

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: updates-req
          fetch-depth: 0

      - name: Fix TypeScript index signature access
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/features/reports/reports.component.ts')
          text = path.read_text(encoding='utf-8')

          old = '''    rows.sort((a, b) => {\n      const dateA = a.transaction_date instanceof Date ? a.transaction_date.getTime() : 0;\n      const dateB = b.transaction_date instanceof Date ? b.transaction_date.getTime() : 0;\n      return dateB - dateA;\n    });'''

          new = '''    rows.sort((a, b) => {\n      const transactionDateA = a['transaction_date'];\n      const transactionDateB = b['transaction_date'];\n      const dateA = transactionDateA instanceof Date ? transactionDateA.getTime() : 0;\n      const dateB = transactionDateB instanceof Date ? transactionDateB.getTime() : 0;\n      return dateB - dateA;\n    });'''

          if old not in text:
              raise SystemExit('Expected TS4111 code block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate
        run: git diff --check

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/reports/reports.component.ts
          git commit -m "fix: resolve report transaction date index signature error"
          git push origin updates-req
          git rm .github/workflows/fix_report_ts4111.yml
          git commit -m "chore: remove temporary report fix workflow"
          git push origin updates-req
